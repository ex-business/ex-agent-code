<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>EX 移动会话</title><link rel="stylesheet" href="/style.css"><script src="/client.js" type="module"></script></head>
<body><header><span class="brand">ex</span><div><h1 id="title" data-i18n="移动会话">移动会话</h1><p id="status" role="status" data-i18n="连接桌面的会话">连接桌面的会话</p></div><button id="disconnect" class="quiet" hidden data-i18n="断开">断开</button></header>
<main><section id="pairing" class="card"><h2 data-i18n="连接你的桌面">连接你的桌面</h2><p data-i18n="在桌面「移动接入」中为当前会话生成配对链接。">在桌面「移动接入」中为当前会话生成配对链接。</p><label for="name" data-i18n="设备名称">设备名称</label><input id="name" maxlength="80" value="我的手机" autocomplete="off"><label for="code" data-i18n="配对码">配对码</label><input id="code" maxlength="64" autocomplete="off" spellcheck="false"><button id="pair" data-i18n="配对">配对</button></section>
<section id="conversation" hidden><button id="older" class="quiet" hidden data-i18n="加载更早消息">加载更早消息</button><button id="latest" class="quiet" hidden data-i18n="回到最新">回到最新</button><div id="messages" aria-live="off"></div><p id="hint"></p></section></main>
<footer id="composer" hidden><label class="sr-only" for="draft" data-i18n="消息">消息</label><textarea id="draft" rows="2" maxlength="16384" placeholder="发送到桌面会话…" data-i18n-placeholder="发送到桌面会话…"></textarea><div class="actions"><span id="scope"></span><button id="resolve" class="quiet" hidden data-i18n="已在桌面核对，解锁输入">已在桌面核对，解锁输入</button><button id="send" data-i18n="发送">发送</button></div></footer></body></html>
